name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 版本号一致性校验
        run: node scripts/check-version.mjs

      - name: 冒烟测试（单题/批量录入/OCR/持久化）
        run: node smoke-test.mjs

      - name: 布局检查（桌面/移动）
        run: node layout-check.mjs

      - name: 注册登录流程
        run: node verify-register.mjs

      - name: 抽题算法覆盖性验证
        run: node verify-review-algo.mjs

      - name: 间隔重复调度验证
        run: node verify-scheduler.mjs

      - name: v1.15.0 新功能验证
        run: node verify-v15.mjs

      - name: v1.16.0 章节树与复习融合验证
        run: node verify-v16.mjs

      - name: v1.18.0 新功能验证
        run: node verify-v18.mjs

      - name: v1.19.0 背单词验证
        run: node verify-v19.mjs

      - name: v1.20.0 背单词升级验证
        run: node verify-v20.mjs

      - name: v1.22.0 背单词重构验证
        run: node verify-v22.mjs

      - name: 全页面走查
        run: node verify-sweep.mjs

      - name: 服务端 API 直接测试
        run: node api-test.mjs

      - name: 掌握度算法专项测试
        run: node verify-mastery.mjs
